<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="brilho" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#1c1a14"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f6e3a1"/>
      <stop offset="0.45" stop-color="#d9b546"/>
      <stop offset="1" stop-color="#9c7a22"/>
    </linearGradient>
    <linearGradient id="ouroEsc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8922f"/>
      <stop offset="1" stop-color="#6e5414"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#brilho)"/>
  <!-- V: braço esquerdo claro, braço direito em tom mais escuro (efeito facetado) -->
  <polygon points="122,138 196,138 256,316 256,384 226,384" fill="url(#ouro)"/>
  <polygon points="390,138 316,138 256,316 256,384 286,384" fill="url(#ouroEsc)"/>
  <!-- traço fino de acabamento abaixo do V -->
  <rect x="216" y="404" width="80" height="6" rx="3" fill="#d4af37" opacity=".55"/>
</svg>
